# Publish the site to GitHub Pages (timbre.k33bz.com) on every push to main: the landing page
# (website/) at / and the gallery (dist/timbre.html) beside it at /timbre.html.
# Forgejo is the primary repo and mirrors here; Forgejo's own runner also reads
# .github/workflows, so the job only runs on github.com. Deploys a build artifact
# rather than a gh-pages branch, which the mirror would delete on its next sync.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # zero dependencies; fails when dist/timbre.html is stale or a featured sound is missing
      - run: node website/build.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
